<!doctype html>
<html lang="vi"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>UnityChess2026 · Admin</title>
<style>body{margin:0;background:#101820;color:#eef3f6;font:16px system-ui}main{max-width:1100px;margin:auto;padding:24px}h1{margin-bottom:4px}small{color:#a5b9c7}input,button,select{padding:12px;border:1px solid #567;background:#1b2b38;color:white;border-radius:6px;margin:6px 0}button{cursor:pointer}#layout{display:grid;grid-template-columns:minmax(280px,520px) 1fr;gap:24px;margin-top:20px}#board{display:grid;grid-template-columns:repeat(8,1fr);aspect-ratio:1;border:6px solid #344957}.square{display:flex;align-items:center;justify-content:center;position:relative;font:clamp(24px,5vw,48px) 'Segoe UI Symbol',serif}.light{background:#e2dccb}.dark{background:#79918b}.piece-white{color:#fff;text-shadow:0 1px 2px #000,1px 0 #333,-1px 0 #333}.piece-black{color:#111;text-shadow:0 1px 1px #fff}.coord{position:absolute;bottom:1px;left:3px;font:10px system-ui;color:#203232}#moves{max-height:360px;overflow:auto;white-space:pre-wrap;line-height:1.8}#details{line-height:1.7;overflow-wrap:anywhere}#message{min-height:24px;color:#f6c979}@media(max-width:700px){#layout{grid-template-columns:1fr}}</style>
<main><h1>Quan sát trận đấu</h1><small>Chỉ đọc · Bàn cờ và lịch sử do server quyết định · Cập nhật mỗi giây</small>
<form id="login"><input id="key" type="password" placeholder="Khóa admin" autocomplete="off" required><button>Kết nối</button><button id="logout" type="button">Ngắt</button></form>
<div id="message" role="status">Nhập khóa để xem trạng thái server.</div><select id="rooms" aria-label="Chọn phòng"></select>
<div id="layout"><div id="board" aria-label="Bàn cờ server"></div><section><h2>Trạng thái server</h2><div id="details">Chưa chọn trận.</div><h2>Nước đi đã duyệt</h2><div id="moves"></div><small id="updated"></small></section></div></main>
<script>
let secret='', allRooms=[], running=false;
const el=id=>document.getElementById(id);
const glyph={p:'♟',r:'♜',n:'♞',b:'♝',q:'♛',k:'♚',P:'♙',R:'♖',N:'♘',B:'♗',Q:'♕',K:'♔'};
function render(){const r=allRooms.find(x=>x.roomId===el('rooms').value);el('board').replaceChildren();if(!r){el('details').textContent='Chưa có phòng đang hoạt động.';el('moves').textContent='';return;}
const rows=r.fen.split(' ')[0].split('/');for(let row=0;row<8;row++){let col=0;for(const token of rows[row]){const count=/[1-8]/.test(token)?Number(token):1;for(let k=0;k<count;k++){const cell=document.createElement('div');cell.className='square '+((row+col)%2?'dark':'light');const piece=glyph[token];if(piece){const span=document.createElement('span');span.className=token===token.toUpperCase()?'piece-white':'piece-black';span.textContent=piece;cell.append(span);}const coord=document.createElement('span');coord.className='coord';coord.textContent=String.fromCharCode(97+col)+(8-row);cell.append(coord);el('board').append(cell);col++;}}}
el('details').textContent='Phòng: '+r.roomId+' | Revision: '+r.revision+'\nTrắng: '+r.white+' | Đen: '+(r.black||'Đang chờ')+'\nLượt: '+r.turn+' | Trạng thái: '+r.status+'\nĐồng hồ: '+Math.ceil(r.whiteTime)+'s / '+Math.ceil(r.blackTime)+'s\nMatch: '+r.matchId+'\nFEN: '+r.fen+(r.winner?'\nKết quả: '+r.winner+' · '+r.reason:'');el('details').style.whiteSpace='pre-line';el('moves').textContent=r.moves.map(m=>m.ply+'. '+(m.color==='w'?'Trắng':'Đen')+'  '+m.san+'  ('+m.from+' → '+m.to+(m.promotion?' = '+m.promotion:'')+')').join('\n')||'Chưa có nước đi.';}
async function poll(){if(!secret||running)return;running=true;try{const response=await fetch('/api/admin/rooms',{headers:{Authorization:'Bearer '+secret},cache:'no-store',signal:AbortSignal.timeout(10000)});if(!response.ok)throw Error(response.status===401?'Khóa admin không hợp lệ.':'Không đọc được trạng thái server: HTTP '+response.status);const data=await response.json();if(!secret)return;const selected=el('rooms').value;allRooms=data.rooms;el('rooms').replaceChildren();for(const r of allRooms){const option=document.createElement('option');option.value=r.roomId;option.textContent=r.roomId+' · '+r.white+' / '+(r.black||'Đang chờ');el('rooms').append(option);}if(allRooms.some(r=>r.roomId===selected))el('rooms').value=selected;render();el('message').textContent='Đã kết nối · '+allRooms.length+' phòng';el('updated').textContent='Server: '+data.serverTime;}catch(error){el('message').textContent=error.message+' · Dữ liệu cũ có thể không còn cập nhật.';}finally{running=false;}}
el('login').onsubmit=event=>{event.preventDefault();secret=el('key').value.trim();el('key').value='';poll();};el('logout').onclick=()=>{secret='';allRooms=[];el('rooms').replaceChildren();render();el('updated').textContent='';el('message').textContent='Đã ngắt kết nối.';};el('rooms').onchange=render;setInterval(poll,1000);
</script></html>
